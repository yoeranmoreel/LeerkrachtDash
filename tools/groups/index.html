<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>ATLAS Groepjesmaker</title><link rel="stylesheet" href="../common.css"></head><body><header class="toolbar"><a href="../../">← ATLAS</a><h1>👥 Groepjesmaker</h1></header><main class="page"><section class="panel"><h2>Maak groepjes</h2><p>Plak je namenlijst, één naam per regel.</p><div class="fields"><div class="field span2"><label>Namen</label><textarea id="names" placeholder="Sara&#10;Mees&#10;Yara&#10;Finn"></textarea></div><div class="field"><label>Groepsgrootte</label><input id="size" type="number" min="2" value="3"><label><input id="fixed" type="checkbox"> Kies aantal groepen i.p.v. groepsgrootte</label></div></div><div class="actions"><button class="primary" id="make">Husselen & maken</button><button class="secondary" id="again">Opnieuw husselen</button></div><div id="result" class="groups result"></div></section></main><script>function make(){let a=document.querySelector("#names").value.split(/\n|,/).map(x=>x.trim()).filter(Boolean).sort(()=>Math.random()-.5),n=Math.max(2,+document.querySelector("#size").value||3),count=document.querySelector("#fixed").checked?n:Math.ceil(a.length/n),g=Array.from({length:count},()=>[]);a.forEach((x,i)=>g[i%count].push(x));document.querySelector("#result").innerHTML=g.map((x,i)=>'<div class="group"><h3>Groep '+(i+1)+'</h3><ul>'+x.map(y=>'<li>'+y.replace(/[<>]/g,"")+'</li>').join("")+'</ul></div>').join("")}document.querySelector("#make").onclick=document.querySelector("#again").onclick=make</script></body></html>
