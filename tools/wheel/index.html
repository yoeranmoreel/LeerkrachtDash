<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>ATLAS Draaiwiel</title><link rel="stylesheet" href="../common.css"><style>.wheel{width:360px;height:360px;border:12px solid #fff;border-radius:50%;margin:20px auto;display:grid;place-items:center;background:conic-gradient(#5b5cf0 0 25%,#f79009 0 50%,#12b76a 0 75%,#f04438 0);box-shadow:0 10px 35px #10182822;transition:transform 3.5s cubic-bezier(.15,.75,.1,1)}.wheel span{background:#fff;border-radius:50%;width:150px;height:150px;display:grid;place-items:center;text-align:center;padding:15px;font-weight:800;font-size:20px}.pointer{text-align:center;font-size:40px;margin-bottom:-35px;position:relative;z-index:2}.layout{display:grid;grid-template-columns:300px 1fr;gap:25px}@media(max-width:750px){.layout{grid-template-columns:1fr}.wheel{width:290px;height:290px}}</style></head><body><header class="toolbar"><a href="../../">← ATLAS</a><h1>🎡 Draaiwiel</h1></header><main class="page"><div class="layout"><section class="panel"><h2>Items</h2><p>Eén naam of keuze per regel.</p><div class="field"><textarea id="items">Sara
Mees
Yara
Finn
Noah
Lina</textarea></div><div class="actions"><button class="secondary" id="shuffle">Husselen</button></div></section><section class="panel"><div class="pointer">▼</div><div class="wheel" id="wheel"><span id="winner">Klaar?</span></div><div class="actions" style="justify-content:center"><button class="primary" id="spin">Draaien!</button><label><input id="remove" type="checkbox"> Winnaar verwijderen</label></div></section></div></main><script>let rot=0;const vals=()=>items.value.split(/\n/).map(x=>x.trim()).filter(Boolean);spin.onclick=()=>{let a=vals();if(!a.length)return;let i=Math.floor(Math.random()*a.length);rot+=1440+Math.floor(Math.random()*720);wheel.style.transform="rotate("+rot+"deg)";winner.textContent="…";setTimeout(()=>{winner.textContent=a[i];if(remove.checked){a.splice(i,1);items.value=a.join("\n")}},3500)};shuffle.onclick=()=>items.value=vals().sort(()=>Math.random()-.5).join("\n")</script></body></html>
