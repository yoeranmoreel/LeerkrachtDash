<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>ATLAS Stoplicht</title><link rel="stylesheet" href="../common.css"></head><body><header class="toolbar"><a href="../../">← ATLAS</a><h1>🚦 Stoplicht</h1></header><main class="page"><section class="panel"><h2>Klasstoplicht</h2><p>Klik op een kleur. Fullscreen werkt prettig op het digibord.</p><div class="lights"><button class="light red" data-label="Stil werken"></button><button class="light amber" data-label="Zacht overleggen"></button><button class="light green" data-label="Overleggen mag"></button></div><h1 id="label" style="text-align:center">Kies een kleur</h1><div class="actions" style="justify-content:center"><button class="secondary" id="full">⛶ Fullscreen</button></div></section></main><script>document.querySelectorAll(".light").forEach(x=>x.onclick=()=>{document.querySelectorAll(".light").forEach(y=>y.classList.toggle("active",y===x));label.textContent=x.dataset.label});full.onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()</script></body></html>
