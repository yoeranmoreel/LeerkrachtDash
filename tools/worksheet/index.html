<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>ATLAS Werkbladmaker</title><link rel="stylesheet" href="../common.css"></head><body><header class="toolbar"><a href="../../">← ATLAS</a><h1>📄 Werkbladmaker</h1><small>v0.1 · Rekenen</small></header><main class="page"><section class="panel config"><h2>Nieuw rekenwerkblad</h2><p>Deze eerste versie genereert lokaal opdrachten. Geen AI of internet nodig.</p><div class="fields"><div class="field"><label>Groep</label><select id="group"><option>4</option><option>5</option><option>6</option><option selected>7</option><option>8</option></select></div><div class="field"><label>Onderwerp</label><select id="topic"><option value="add">Optellen & aftrekken</option><option value="tables">Tafels & delen</option><option value="percent">Procenten</option><option value="money">Geld</option></select></div><div class="field"><label>Aantal opgaven</label><input id="amount" type="number" min="5" max="30" value="10"></div><div class="field span3"><label>Titel</label><input id="title" value="Rekenen - oefenen"></div></div><div class="actions"><button class="primary" id="generate">Genereer werkblad</button><button class="secondary" onclick="print()">Print / PDF</button><label><input id="answers" type="checkbox"> Antwoorden tonen</label></div></section><article id="sheet" class="worksheet"><h1>Maak hierboven eerst een werkblad</h1></article></main><script>const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;function q(topic,g){let max=g<6?100:g<8?1000:10000,a,b,ans,text;if(topic==="add"){a=rnd(10,max);b=rnd(10,max);let plus=Math.random()>.45;if(!plus&&b>a)[a,b]=[b,a];ans=plus?a+b:a-b;text=a+(plus?" + ":" − ")+b+" = ______"}else if(topic==="tables"){a=rnd(2,12);b=rnd(2,12);if(Math.random()>.5){ans=a*b;text=a+" × "+b+" = ______"}else{ans=b;text=(a*b)+" ÷ "+a+" = ______"}}else if(topic==="percent"){let p=[10,20,25,50,75][rnd(0,4)],base=[20,40,50,80,100,120,200,400][rnd(0,7)];ans=p/100*base;text=p+"% van "+base+" = ______"}else{let price=rnd(150,5000)/100,paid=Math.ceil(price/5)*5;ans=(paid-price).toFixed(2);text="Je betaalt € "+price.toFixed(2).replace(".",",")+" met € "+paid.toFixed(2).replace(".",",")+". Hoeveel krijg je terug? ______"}return{text,ans}}function gen(){let qs=Array.from({length:+amount.value},()=>q(topic.value,+group.value));sheet.innerHTML="<h1>"+title.value.replace(/[<>]/g,"")+"</h1><p>Naam: ____________________ &nbsp;&nbsp; Datum: __________</p><div class=questions>"+qs.map((x,i)=>'<div class=question><b>'+(i+1)+'.</b> '+x.text+'<div class=answer '+(answers.checked?"":"hidden")+' data-answer>'+x.ans+'</div></div>').join("")+"</div>";toggle()}function toggle(){document.querySelectorAll("[data-answer]").forEach(x=>x.style.display=answers.checked?"block":"none")}generate.onclick=gen;answers.onchange=toggle</script></body></html>
