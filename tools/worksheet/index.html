<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>ATLAS Werkbladmaker</title><link rel="stylesheet" href="../common.css"><style>.worksheet{background:#fff}.questions.compact{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:10px 22px}.compact .question{break-inside:avoid;padding:4px 0;font-size:15px}.sumline{display:inline}.answer-slot{display:inline-block;min-width:62px;border-bottom:1px solid #222;text-align:center;height:20px}.story .question{margin-bottom:20px}@media print{.toolbar,.config{display:none!important}.page{padding:0!important}.worksheet{box-shadow:none!important;border:0!important;margin:0!important;padding:12mm!important}.questions.compact{gap:6px 18px}.compact .question{font-size:13px}}</style></head><body><header class="toolbar"><a href="../../">← ATLAS</a><h1>📄 Werkbladmaker</h1><small>Rekenen</small></header><main class="page"><section class="panel config"><h2>Nieuw rekenwerkblad</h2><div class="fields"><div class="field"><label>Groep</label><select id="group"><option>4</option><option>5</option><option>6</option><option selected>7</option><option>8</option></select></div><div class="field"><label>Onderwerp</label><select id="topic"><option value="add">Optellen & aftrekken</option><option value="tables">Tafels & delen</option><option value="percent">Procenten</option><option value="money">Geld</option></select></div><div class="field"><label>Aantal</label><input id="amount" type="number" min="5" max="120" value="30"></div><div class="field"><label>Kolommen</label><select id="columns"><option value="auto">Automatisch</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div><div class="field span3"><label>Titel</label><input id="title" value="Rekenen - oefenen"></div></div><div class="actions"><button class="primary" id="generate">Genereer werkblad</button><button class="secondary" onclick="print()">Print / PDF</button><label><input id="answers" type="checkbox"> Antwoordenblad</label></div></section><article id="sheet" class="worksheet"><h1>Maak hierboven eerst een werkblad</h1></article></main><script>
const $=s=>document.querySelector(s),rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;let current=[];function q(t,g){let max=g<6?100:g<8?1000:10000,a,b,ans,left;if(t==="add"){a=rnd(10,max);b=rnd(10,max);let plus=Math.random()>.45;if(!plus&&b>a)[a,b]=[b,a];ans=plus?a+b:a-b;left=a+(plus?" + ":" − ")+b+" = "}else if(t==="tables"){a=rnd(2,12);b=rnd(2,12);if(Math.random()>.5){ans=a*b;left=a+" × "+b+" = "}else{ans=b;left=(a*b)+" ÷ "+a+" = "}}else if(t==="percent"){let p=[10,20,25,50,75][rnd(0,4)],base=[20,40,50,80,100,120,200,400][rnd(0,7)];ans=p/100*base;left=p+"% van "+base+" = "}else{let price=rnd(150,5000)/100,paid=Math.ceil(price/5)*5;ans="€ "+(paid-price).toFixed(2).replace(".",",");left="€ "+price.toFixed(2).replace(".",",")+" betaald met € "+paid.toFixed(2).replace(".",",")+" → terug: "}return{left,ans}}function render(){let n=current.length,t=$("#topic").value,cols=$("#columns").value==="auto"?(n>=80?5:n>=50?4:n>=25?3:2):+$("#columns").value;$("#sheet").innerHTML="<h1>"+$("#title").value.replace(/[<>]/g,"")+"</h1><p>Naam: ____________________ &nbsp;&nbsp; Datum: __________</p><div class='questions compact' style='--cols:"+cols+"'>"+current.map((x,i)=>'<div class="question"><b>'+(i+1)+'.</b> <span class="sumline">'+x.left+'</span><span class="answer-slot">'+($("#answers").checked?x.ans:"")+'</span></div>').join("")+"</div>"}function gen(){current=Array.from({length:+$("#amount").value},()=>q($("#topic").value,+$("#group").value));render()}$("#generate").onclick=gen;$("#answers").onchange=render;$("#columns").onchange=()=>current.length&&render();</script></body></html>
