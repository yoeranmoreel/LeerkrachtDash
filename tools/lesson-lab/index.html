<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATLAS Leslab</title><style>
:root{--p:#5b5cf0;--ink:#172033;--muted:#667085;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f6fa;color:var(--ink)}button,input,textarea,select{font:inherit}.top{height:58px;background:#111827;color:#fff;display:flex;align-items:center;padding:0 20px;gap:18px;position:sticky;top:0;z-index:4}.top a{color:#fff;text-decoration:none}.top span{color:#98a2b3;font-size:12px}.wrap{max-width:1180px;margin:auto;padding:34px 20px}.hero h1{font-size:42px;margin:4px 0}.hero p{color:var(--muted)}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:24px 0}.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px}.tabs button.active{background:var(--ink);color:#fff}.lab{display:grid;grid-template-columns:360px 1fr;gap:18px}.controls,.output{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;min-height:440px}.controls label{display:block;font-size:11px;font-weight:700;margin:12px 0 5px}.controls input,.controls textarea,.controls select{width:100%;border:1px solid #d0d5dd;border-radius:9px;padding:10px}.controls textarea{min-height:150px;resize:vertical}.controls button,.output button{border:0;background:var(--p);color:#fff;border-radius:9px;padding:10px 13px;margin-top:12px}.big{font-size:clamp(34px,7vw,82px);font-weight:850;text-align:center;margin:70px 0 20px}.sub{text-align:center;color:var(--muted)}.cards{display:grid;gap:10px}.qcard{border:1px solid var(--line);border-radius:12px;padding:14px}.numberline{height:120px;position:relative;margin:80px 30px}.numberline:before{content:"";position:absolute;left:0;right:0;top:50%;height:3px;background:#172033}.tick{position:absolute;top:43%;width:2px;height:18px;background:#172033}.tick span{position:absolute;top:24px;transform:translateX(-50%);font-size:12px}.fraction{display:flex;height:90px;margin:80px 20px;border:3px solid #172033}.fraction i{flex:1;border-right:2px solid #172033}.fraction i:last-child{border:0}.sentence{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:70px}.word{padding:12px 16px;background:#eeeeff;border-radius:10px;font-size:24px}.vote{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:50px 0}.vote button{font-size:26px;min-width:100px;background:#f3f4f6;color:#172033;border:1px solid var(--line)}.result{font-size:24px;text-align:center;font-weight:800}.steps{counter-reset:s}.steps div{counter-increment:s;padding:15px;margin:9px;border-left:4px solid var(--p);background:#f8f9fb}.steps div:before{content:counter(s) ". ";font-weight:900;color:var(--p)}@media(max-width:760px){.lab{grid-template-columns:1fr}.hero h1{font-size:34px}}</style></head><body><header class="top"><a href="../../">← <b>ATLAS</b></a><span>Leslab</span></header><main class="wrap"><div class="hero"><small>LES-TOOLS</small><h1>Leslab</h1><p>Kleine hulpmiddelen die je tijdens of vlak vóór je les nodig hebt.</p></div><nav id="tabs" class="tabs"></nav><section class="lab"><div id="controls" class="controls"></div><div id="output" class="output"></div></section></main><script>
const $=s=>document.querySelector(s);let active="flash";const tools=[
["flash","⚡ Woordflitser"],["question","❓ Vragenmaker"],["exit","🚪 Exit-ticket"],["number","↔ Getallenlijn"],["fraction","◫ Breukenstrook"],["sentence","🔤 Zinsbouwer"],["vote","✋ Stemtool"],["steps","☑ Instructiestappen"],["dictation","✏️ Dictee"],["picker","🎯 Beurtenpot"]];
function lines(v){return v.split(/\n/).map(x=>x.trim()).filter(Boolean)}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function renderTabs(){$("#tabs").innerHTML=tools.map(t=>'<button data-id="'+t[0]+'" class="'+(active===t[0]?"active":"")+'">'+t[1]+'</button>').join("")}
function render(){renderTabs();let c=$("#controls"),o=$("#output");if(active==="flash"){c.innerHTML='<h3>Woordflitser</h3><label>Woorden</label><textarea id="list" placeholder="Eén woord per regel"></textarea><label>Tempo</label><select id="speed"><option value="2000">2 sec</option><option value="3000">3 sec</option><option value="5000">5 sec</option></select><button id="go">Start flitsen</button>';o.innerHTML='<div class="big">Klaar?</div><div class="sub">De woorden verschijnen hier één voor één.</div>';$("#go").onclick=()=>{let a=lines($("#list").value),i=0;if(!a.length)return;o.innerHTML='<div class="big" id="flashword"></div><div class="sub">Klik Stop om te stoppen.</div><button id="stop">Stop</button>';let w=$("#flashword"),tick=()=>{w.textContent=a[i++%a.length]};tick();let it=setInterval(tick,+$("#speed").value);$("#stop").onclick=()=>clearInterval(it)}}else if(active==="question"){c.innerHTML='<h3>Klassikale vragen</h3><label>Onderwerp</label><input id="topic" placeholder="Bijv. breuken"><label>Aantal</label><input id="amount" type="number" min="1" max="12" value="5"><button id="go">Maak vraagstarters</button>';o.innerHTML='<p>ATLAS maakt didactische vraagstarters; jij vult de vakinhoud in.</p>';$("#go").onclick=()=>{let t=$("#topic").value||"dit onderwerp",qs=["Wat weet je al over "+t+"?","Leg in je eigen woorden uit wat "+t+" betekent.","Geef een voorbeeld van "+t+".","Welke fout zou iemand bij "+t+" kunnen maken?","Hoe controleer je of je antwoord klopt?","Wat is het verschil tussen twee aanpakken bij "+t+"?","Bedenk zelf een opgave over "+t+".","Welke stap vind je het belangrijkst en waarom?"];o.innerHTML='<div class="cards">'+shuffle(qs).slice(0,+$("#amount").value).map(q=>'<div class="qcard">'+q+'</div>').join("")+'</div>'}}else if(active==="exit"){c.innerHTML='<h3>Exit-ticket</h3><label>Lesdoel</label><input id="goal" placeholder="Ik kan…"><button id="go">Maak ticket</button>';o.innerHTML='<p>Een korte afsluiting voor de laatste minuten van je les.</p>';$("#go").onclick=()=>{let g=$("#goal").value||"het lesdoel";o.innerHTML='<div class="cards"><div class="qcard"><b>1.</b> Laat met één voorbeeld zien dat je '+g.replace(/^Ik kan /i,"").replace(/\.$/,"")+'.</div><div class="qcard"><b>2.</b> Welke stap was vandaag het belangrijkst?</div><div class="qcard"><b>3.</b> 🟢 Ik kan dit zelf &nbsp; 🟠 Nog oefenen &nbsp; 🔴 Ik heb hulp nodig</div></div><button onclick="print()">Print</button>'}}else if(active==="number"){c.innerHTML='<h3>Getallenlijn</h3><label>Van</label><input id="from" type="number" value="0"><label>Tot</label><input id="to" type="number" value="100"><label>Stapgrootte</label><input id="step" type="number" value="10"><button id="go">Teken getallenlijn</button>';o.innerHTML="";$("#go").onclick=()=>{let a=+$("#from").value,b=+$("#to").value,s=Math.max(1,+$("#step").value),vals=[];for(let n=a;n<=b&&vals.length<30;n+=s)vals.push(n);o.innerHTML='<div class="numberline">'+vals.map((n,i)=>'<i class="tick" style="left:'+(i/(vals.length-1||1)*100)+'%"><span>'+n+'</span></i>').join("")+'</div>'}}else if(active==="fraction"){c.innerHTML='<h3>Breukenstrook</h3><label>Noemer</label><input id="den" type="number" min="2" max="20" value="4"><label>Hoeveel delen inkleuren?</label><input id="num" type="number" min="0" value="1"><button id="go">Maak strook</button>';o.innerHTML="";$("#go").onclick=()=>{let d=Math.min(20,Math.max(2,+$("#den").value)),n=Math.min(d,Math.max(0,+$("#num").value));o.innerHTML='<div class="big">'+n+'/'+d+'</div><div class="fraction">'+Array.from({length:d},(_,i)=>'<i style="'+(i<n?"background:#bfc0ff":"")+'"></i>').join("")+'</div>'}}else if(active==="sentence"){c.innerHTML='<h3>Zinsbouwer</h3><label>Zin</label><textarea id="sentence" placeholder="De snelle hond rent door het park."></textarea><button id="go">Hussel woorden</button>';o.innerHTML="";$("#go").onclick=()=>{let a=$("#sentence").value.trim().split(/\s+/);o.innerHTML='<div class="sentence">'+shuffle(a).map(w=>'<span class="word">'+w+'</span>').join("")+'</div><p class="sub">Zet de woorden weer in de goede volgorde.</p>'}}else if(active==="vote"){c.innerHTML='<h3>Klassikale stemtool</h3><label>Vraag</label><input id="vq" placeholder="Welke keuze is juist?"><label>Antwoorden (max. 4)</label><textarea id="va">A\nB\nC\nD</textarea><button id="go">Start stemming</button>';o.innerHTML="";$("#go").onclick=()=>{let a=lines($("#va").value).slice(0,4),counts=a.map(()=>0);o.innerHTML='<h2 style="text-align:center">'+($("#vq").value||"Stem!")+'</h2><div class="vote">'+a.map((x,i)=>'<button data-v="'+i+'">'+x+'<br><small>0</small></button>').join("")+'</div><div class="result">0 stemmen</div>';o.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{counts[+b.dataset.v]++;b.querySelector("small").textContent=counts[+b.dataset.v];o.querySelector(".result").textContent=counts.reduce((x,y)=>x+y,0)+" stemmen"})}}else if(active==="steps"){c.innerHTML='<h3>Instructiestappen</h3><label>Stappen</label><textarea id="list" placeholder="Pak je schrift\nSchrijf de datum\nMaak opdracht 1 t/m 5"></textarea><button id="go">Toon stappen</button>';o.innerHTML="";$("#go").onclick=()=>o.innerHTML='<div class="steps">'+lines($("#list").value).map(x=>'<div>'+x+'</div>').join("")+'</div>'}else if(active==="dictation"){c.innerHTML='<h3>Dictee-tool</h3><label>Woorden / zinnen</label><textarea id="list" placeholder="Eén item per regel"></textarea><label>Volgorde</label><select id="order"><option value="normal">Ingevoerd</option><option value="random">Willekeurig</option></select><button id="go">Start dictee</button>';o.innerHTML='<div class="big">✏️</div>';$("#go").onclick=()=>{let a=lines($("#list").value);if($("#order").value==="random")a=shuffle(a);let i=0;o.innerHTML='<div class="big" id="dword">Verborgen</div><div class="sub" id="dcount"></div><button id="show">Toon</button> <button id="next">Volgende</button>';let paint=()=>{$("#dword").textContent="••••••";$("#dcount").textContent=(i+1)+" / "+a.length};paint();$("#show").onclick=()=>$("#dword").textContent=a[i]||"Klaar";$("#next").onclick=()=>{i=Math.min(i+1,a.length);paint()}}}else{c.innerHTML='<h3>Beurtenpot</h3><label>Namen</label><textarea id="list" placeholder="Eén naam per regel"></textarea><label><input id="remove" type="checkbox" checked style="width:auto"> Gekozen naam uit de pot halen</label><button id="go">Kies iemand</button><button id="reset">Opnieuw vullen</button>';o.innerHTML='<div class="big" id="picked">Wie?</div><div class="sub" id="remain"></div>';let pool=[];$("#go").onclick=()=>{if(!pool.length)pool=lines($("#list").value);if(!pool.length)return;let i=Math.floor(Math.random()*pool.length);$("#picked").textContent=pool[i];if($("#remove").checked)pool.splice(i,1);$("#remain").textContent=pool.length+" namen over"};$("#reset").onclick=()=>{pool=lines($("#list").value);$("#picked").textContent="Wie?";$("#remain").textContent=pool.length+" namen in de pot"}}}
$("#tabs").onclick=e=>{let b=e.target.closest("[data-id]");if(b){active=b.dataset.id;render()}};render();</script></body></html>
