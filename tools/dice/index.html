<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>ATLAS Dobbelstenen</title><link rel="stylesheet" href="../common.css"></head><body><header class="toolbar"><a href="../../">← ATLAS</a><h1>🎲 Dobbelstenen</h1></header><main class="page"><section class="panel"><h2>Dobbelstenen</h2><p>Kies hoeveel dobbelstenen je wilt en gooi.</p><div class="actions"><select id="count"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select><button class="primary" id="roll">🎲 Gooien</button></div><div id="dice" class="dice"></div></section></main><script>const chars=["⚀","⚁","⚂","⚃","⚄","⚅"];function roll(){let n=+count.value;dice.innerHTML=Array.from({length:n},()=>'<div class="die">'+chars[Math.floor(Math.random()*6)]+'</div>').join("")}document.querySelector("#roll").onclick=roll;roll()</script></body></html>
