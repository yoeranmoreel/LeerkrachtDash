<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>ATLAS Contextsommen</title><link rel="stylesheet" href="../common.css"></head><body><header class="toolbar"><a href="../../">← ATLAS</a><h1>🧠 Contextsommen</h1><small>lokale generator</small></header><main class="page"><section class="panel config"><h2>Contextsommen maken</h2><p>Verschillende somstructuren, contexten en taalniveaus. Alles lokaal gegenereerd.</p><div class="fields"><div class="field"><label>Groep</label><select id="group"><option>5</option><option>6</option><option selected>7</option><option>8</option></select></div><div class="field"><label>Soort</label><select id="kind"><option value="mix">Gemengd</option><option value="add">Totaal / verschil</option><option value="multiply">Keer / delen</option><option value="money">Geld</option><option value="time">Tijd</option><option value="multi">Meerstaps</option></select></div><div class="field"><label>Aantal</label><input id="amount" type="number" value="10" min="5" max="30"></div></div><div class="actions"><button id="make" class="primary">Nieuwe sommen</button><button class="secondary" onclick="print()">Print / PDF</button><label><input id="show" type="checkbox"> Antwoorden</label></div></section><article class="worksheet" id="sheet"></article></main><script>
const $=s=>document.querySelector(s),r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[r(0,a.length-1)],names=["Mila","Yassin","Noah","Lina","Sem","Aya","Finn","Sara"],places=["schoolbibliotheek","sportdag","schooltuin","museum","klas","markt","technieklokaal"];function one(type,g){if(type==="mix")type=pick(["add","multiply","money","time","multi"]);let n=pick(names),place=pick(places),big=g>=7;if(type==="add"){let a=r(big?350:80,big?4500:900),b=r(big?120:30,a-10);return pick([{q:"Tijdens een actie verzamelt "+n+" "+a+" punten. Een klasgenoot verzamelt "+b+" punten. Hoeveel punten hebben ze samen?",a:a+b},{q:"Voor "+place+" zijn "+a+" kaartjes beschikbaar. Er zijn al "+b+" kaartjes gebruikt. Hoeveel zijn er nog over?",a:a-b},{q:"Groep A heeft "+a+" punten en groep B "+b+". Hoeveel punten verschil is er?",a:a-b}])}if(type==="multiply"){let boxes=r(3,12),each=r(6,big?36:18),total=boxes*each;return pick([{q:"Voor "+place+" staan "+boxes+" bakken klaar. In iedere bak liggen "+each+" materialen. Hoeveel materialen zijn dat samen?",a:total},{q:"Er zijn "+total+" kaartjes. Ze worden eerlijk verdeeld over "+boxes+" groepjes. Hoeveel kaartjes krijgt ieder groepje?",a:each},{q:n+" maakt "+boxes+" rijen met steeds "+each+" tegels. Hoeveel tegels gebruikt "+n+"?",a:total}])}if(type==="money"){let count=r(2,8),cents=r(125,975),total=count*cents;return pick([{q:n+" koopt "+count+" dezelfde schriftjes van € "+(cents/100).toFixed(2).replace(".",",")+" per stuk. Hoeveel betaalt "+n+"?",a:"€ "+(total/100).toFixed(2).replace(".",",")},{q:"De klas heeft € "+(Math.ceil(total/500)*5).toFixed(2).replace(".",",")+". Ze kopen "+count+" materialen van € "+(cents/100).toFixed(2).replace(".",",")+" per stuk. Hoeveel geld blijft over?",a:"€ "+((Math.ceil(total/500)*500-total)/100).toFixed(2).replace(".",",")}])}if(type==="time"){let start=r(8,14),mins=pick([25,35,45,60,75,90]),end=start*60+mins;return pick([{q:"Een activiteit begint om "+String(start).padStart(2,"0")+":00 en duurt "+mins+" minuten. Hoe laat is de activiteit afgelopen?",a:String(Math.floor(end/60)).padStart(2,"0")+":"+String(end%60).padStart(2,"0")},{q:n+" leest van "+String(start).padStart(2,"0")+":00 tot "+String(Math.floor(end/60)).padStart(2,"0")+":"+String(end%60).padStart(2,"0")+". Hoeveel minuten heeft "+n+" gelezen?",a:mins+" minuten"}])}let groups=r(3,7),per=r(8,big?28:16),used=r(5,groups*per-2);return pick([{q:"Voor "+place+" zijn "+groups+" dozen met elk "+per+" materialen klaargezet. Tijdens de ochtend worden er "+used+" gebruikt. Hoeveel materialen zijn er daarna nog?",a:groups*per-used},{q:"De school bestelt "+groups+" pakken met ieder "+per+" kaartjes. De kaartjes worden daarna eerlijk verdeeld over "+groups+" groepen. Hoeveel kaartjes krijgt iedere groep?",a:per}])}
let qs=[];function gen(){qs=Array.from({length:+$("#amount").value},()=>one($("#kind").value,+$("#group").value));render()}function render(){$("#sheet").innerHTML="<h1>Contextsommen · Groep "+$("#group").value+"</h1><p>Naam: ____________________ &nbsp; Datum: __________</p><div class=questions>"+qs.map((x,i)=>'<div class=question><b>'+(i+1)+'.</b> '+x.q+'<div style="height:42px"></div><div data-answer>'+( $("#show").checked?"Antwoord: "+x.a:"")+'</div></div>').join("")+"</div>"}$("#make").onclick=gen;$("#show").onchange=render;gen();</script></body></html>
