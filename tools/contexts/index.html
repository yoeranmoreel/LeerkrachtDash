<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>ATLAS Contextsommen</title><link rel="stylesheet" href="../common.css"></head><body><header class="toolbar"><a href="../../">← ATLAS</a><h1>🧠 Contextsommen</h1><small>lokale generator</small></header><main class="page"><section class="panel config"><h2>Contextsommen maken</h2><p>Deze versie maakt heldere verhaalsommen zonder AI. De getallen passen zich grofweg aan de groep aan.</p><div class="fields"><div class="field"><label>Groep</label><select id="group"><option>5</option><option>6</option><option selected>7</option><option>8</option></select></div><div class="field"><label>Soort</label><select id="kind"><option value="mix">Gemengd</option><option value="money">Geld</option><option value="multiply">Keer / delen</option><option value="difference">Verschil</option></select></div><div class="field"><label>Aantal</label><input id="amount" type="number" value="10" min="5" max="20"></div></div><div class="actions"><button id="make" class="primary">Nieuwe sommen</button><button class="secondary" onclick="print()">Print / PDF</button><label><input id="show" type="checkbox"> Antwoorden</label></div></section><article class="worksheet" id="sheet"></article></main><script>const r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;function one(type,g){if(type==="mix")type=["money","multiply","difference"][r(0,2)];if(type==="money"){let n=r(2,8),p=r(125,950)/100;return {q:"Voor een activiteit koopt de klas "+n+" dezelfde materialen. Eén materiaal kost € "+p.toFixed(2).replace(".",",")+". Hoeveel betaalt de klas in totaal?",a:"€ "+(n*p).toFixed(2).replace(".",",")}}if(type==="multiply"){let boxes=r(4,12),each=r(g<7?6:12,g<7?18:35),total=boxes*each;return Math.random()>.5?{q:"In het magazijn staan "+boxes+" dozen. In elke doos zitten "+each+" schriften. Hoeveel schriften zijn dat samen?",a:total}:{q:"De school verdeelt "+total+" potloden eerlijk over "+boxes+" groepen. Hoeveel potloden krijgt elke groep?",a:each}}let a=r(g<7?150:800,g<7?800:5000),b=r(80,a-20);return {q:"Tijdens de sponsorloop loopt groep A "+a+" rondjes. Groep B loopt "+b+" rondjes. Hoeveel rondjes meer loopt groep A?",a:a-b}}function gen(){let qs=Array.from({length:+amount.value},()=>one(kind.value,+group.value));sheet.innerHTML="<h1>Contextsommen · Groep "+group.value+"</h1><p>Naam: ____________________ &nbsp; Datum: __________</p><div class=questions>"+qs.map((x,i)=>'<div class=question><b>'+(i+1)+'.</b> '+x.q+'<div style="height:38px"></div><div class=answer data-answer>Antwoord: '+x.a+'</div></div>').join("")+"</div>";toggle()}function toggle(){document.querySelectorAll("[data-answer]").forEach(x=>x.style.display=show.checked?"block":"none")}make.onclick=gen;show.onchange=toggle;gen()</script></body></html>
