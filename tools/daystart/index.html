<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATLAS Dagstart</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,sans-serif;background:#f5f6fa;color:#172033}header{height:58px;background:#111827;color:#fff;padding:18px}header a{color:#fff;text-decoration:none}.wrap{max-width:1050px;margin:auto;padding:30px 18px}.edit,.screen{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:11px;font-weight:700}input,textarea{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:8px;margin-top:5px;font:inherit}textarea{min-height:110px}button{border:0;background:#5b5cf0;color:#fff;padding:11px 14px;border-radius:9px;font:inherit;margin-top:12px}.screen h1{font-size:48px;margin:4px 0}.date{color:#5b5cf0;font-weight:800}.columns{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#f8f9fb;border-radius:14px;padding:18px;min-height:180px}.card h2{margin-top:0}.card div{white-space:pre-wrap;font-size:20px;line-height:1.55}@media(max-width:650px){.grid,.columns{grid-template-columns:1fr}}</style></head><body><header><a href="../../">← <b>ATLAS</b></a></header><main class="wrap"><section class="edit"><h2>Dagstart instellen</h2><div class="grid"><label>Titel<input id="title" value="Goedemorgen!"></label><label>Bijzonderheid<input id="special" placeholder="Gym om 10:30"></label><label>Planning<textarea id="plan" placeholder="Rekenen\nTaal\nPauze\nLezen"></textarea></label><label>Startopdracht<textarea id="task" placeholder="Pak je leesboek en lees 10 minuten."></textarea></label></div><button id="show">Bijwerken</button><button id="full">Volledig scherm</button></section><section class="screen" id="screen"><div class="date" id="date"></div><h1 id="outTitle">Goedemorgen!</h1><p id="outSpecial"></p><div class="columns"><div class="card"><h2>Vandaag</h2><div id="outPlan">Nog geen planning.</div></div><div class="card"><h2>Startopdracht</h2><div id="outTask">Nog geen startopdracht.</div></div></div></section></main><script>const $=s=>document.querySelector(s);$("#date").textContent=new Date().toLocaleDateString("nl-NL",{weekday:"long",day:"numeric",month:"long"});$("#show").onclick=()=>{$("#outTitle").textContent=$("#title").value||"Goedemorgen!";$("#outSpecial").textContent=$("#special").value;$("#outPlan").textContent=$("#plan").value||"Nog geen planning.";$("#outTask").textContent=$("#task").value||"Nog geen startopdracht."};$("#full").onclick=()=>$("#screen").requestFullscreen();</script></body></html>
