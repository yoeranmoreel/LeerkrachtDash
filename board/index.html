<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#111827"><title>ATLAS Board</title><link rel="icon" href="../icons/icon.svg"><link rel="stylesheet" href="board.css"></head><body>
<header class="bar"><a class="back" href="../">← <b>ATLAS</b></a><span class="boardname">Nieuw bord</span><div class="bar-actions"><button id="fullscreen" title="Volledig scherm">⛶</button><button id="clear" title="Alles wissen">Wissen</button></div></header>
<div class="toolbar" aria-label="Whiteboard gereedschap"><button class="tool active" data-tool="pen" title="Pen">✎</button><button class="tool" data-tool="highlighter" title="Markeerstift">▰</button><button class="tool" data-tool="eraser" title="Gum">⌫</button><span class="divider"></span><label class="color"><input id="color" type="color" value="#172033"><span></span></label><select id="size" title="Lijndikte"><option value="3">Dun</option><option value="6" selected>Normaal</option><option value="12">Dik</option><option value="24">Extra dik</option></select><span class="divider"></span><button id="undo" title="Ongedaan maken">↶</button><button id="redo" title="Opnieuw">↷</button><span class="divider"></span><button id="addTimer" class="widgetbutton">＋ Timer</button></div>
<main id="stage"><canvas id="board"></canvas><div id="widgets"></div><div class="hint">Schrijf, teken of voeg een bordtool toe</div></main>
<script src="board.js"></script></body></html>
