<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#111827"><title>ATLAS Board</title><link rel="icon" href="../icons/icon.svg"><link rel="stylesheet" href="board.css?v=20261006-12"></head><body>
<header class="top"><a href="../">← <b>ATLAS</b></a><span id="boardName">Nieuw bord</span><div><button id="openBoard">Openen</button><button id="saveBoard">Opslaan</button><button id="fullscreen">⛶</button></div></header>
<div id="scroller"><main id="stage"><svg id="ink"></svg><div id="objects"></div></main></div>
<footer class="dock">
<div class="dock-left">
<button class="mode active" data-tool="select">↖<small>Selecteer</small></button><button class="mode" data-tool="pen">✎<small>Pen</small></button><button class="mode" data-tool="marker">▰<small>Marker</small></button><button class="mode" data-tool="eraser">⌫<small>Gum</small></button><button class="mode" data-tool="text">T<small>Tekst</small></button>
<span class="sep"></span><label class="swatch" title="Tekenkleur"><input id="drawColor" type="color" value="#172033"><i></i></label><select id="drawSize"><option value="3">Dun</option><option value="6" selected>Normaal</option><option value="12">Dik</option><option value="20">Extra dik</option></select>
<button id="undo">↶</button><button id="redo">↷</button><button id="toolsButton" title="Bordtools">🧰</button><button id="favoritesButton" title="Favorieten">★</button><button id="templatesButton" title="Templates">▤</button><button id="backgroundButton" title="Achtergrond">🎨</button><button id="shorten">↑ Inkorten</button><button id="extend">↓ Verlengen</button>
</div><div class="dock-right"><button id="prev">‹</button><span id="pageLabel">1 / 1</span><button id="next">›</button><button id="clonePage">⧉</button><button id="addPage">＋ Pagina</button></div></footer>
<section id="textBar" class="contextbar" hidden><b>Tekst</b><select id="fontFamily"><option value="standard">Standaard</option><option value="readable">Extra leesbaar</option><option value="school">Schoolschrift</option><option value="connected">Verbonden Schrift</option></select><label>Grootte <input id="fontSize" type="number" min="12" max="160" value="32"></label><label class="swatch"><input id="fontColor" type="color" value="#172033"><i></i></label><button id="duplicate">⧉</button><button id="delete">🗑</button></section>
<section id="selectionBar" class="contextbar" hidden><span id="selectionLabel">Object</span><button id="duplicate2">⧉ Dupliceren</button><button id="delete2">🗑 Verwijderen</button></section>
<aside id="toolsPanel" class="panel" hidden><div class="panelhead"><b>Bordtools</b><button data-close>×</button></div><div id="toolGrid" class="toolgrid"></div></aside>
<aside id="favoritesPanel" class="panel" hidden><div class="panelhead"><b>Favorieten</b><button data-close>×</button></div><p>★-tools uit Leslab verschijnen hier.</p><div id="favoriteGrid" class="toolgrid"></div></aside>
<aside id="templatesPanel" class="panel" hidden><div class="panelhead"><b>Templates</b><button data-close>×</button></div><p>Voegt een complete bordopzet toe.</p><div id="templateGrid" class="toolgrid"></div></aside>
<aside id="settingsPanel" class="panel settings-panel" hidden><div class="panelhead"><b id="settingsTitle">Instellingen</b><button data-close>×</button></div><div id="settingsBody"></div></aside>
<aside id="backgroundPanel" class="panel" hidden><div class="panelhead"><b>Achtergrond</b><button data-close>×</button></div><label>Papierkleur<input id="paperColor" type="color" value="#ffffff"></label><label>Overlay<select id="overlay"><option value="none">Geen</option><option value="lines">Lijnen</option><option value="grid">Ruitjes</option><option value="dots">Punten</option></select></label><label>Overlaykleur<input id="overlayColor" type="color" value="#d5d9e0"></label><label>Afstand <span><input id="overlaySize" type="range" min="16" max="80" step="2" value="32"> <small id="overlaySizeValue">32 px</small></span></label></aside>
<dialog id="boardsDialog"><div class="panelhead"><b>Mijn borden</b><button id="closeBoards">×</button></div><div id="boardsList"></div></dialog>
<script src="../shared/favorites.js?v=20261006-4"></script><script src="catalog.js?v=20261006-4"></script><script src="templates.js?v=20261006-4"></script><script>window.addEventListener("error",function(e){document.body.dataset.boardError=e.message||"script error"});</script><script src="board.js?v=20261006-12"></script></body></html>
